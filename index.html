<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シフト提出</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root { --main: #06c755; --text: #222; --sub: #777; --line: #e5e5e5; --bg: #f5f6f7; --warn: #fff4e5; --warn-text: #b45309; --lock: #f0f0f0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; color: var(--text); background: var(--bg); font-size: 15px; }
  header { background: #fff; padding: 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 4px; font-size: 18px; }
  header p { margin: 2px 0; color: var(--sub); font-size: 13px; }
  .banner { margin: 12px 16px; padding: 10px 12px; border-radius: 8px; background: #e8f8ee; font-size: 13px; }
  .banner.late { background: var(--warn); color: var(--warn-text); }
  .banner.closed { background: #fdecec; color: #b42318; }
  .card { background: #fff; margin: 12px 16px; border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; }
  .weeks { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .weeks label { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  .times { display: flex; align-items: center; gap: 6px; }
  select { font-size: 15px; padding: 6px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  .row { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: none; }
  .date { width: 68px; font-weight: 600; }
  .date.sat { color: #2563eb; } .date.sun { color: #dc2626; }
  .row .times { flex: 1; }
  .clear { border: none; background: none; color: var(--sub); font-size: 13px; padding: 4px; }
  .locked { flex: 1; color: var(--sub); }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--lock); color: var(--sub); margin-left: 4px; }
  .tag.add { background: var(--warn); color: var(--warn-text); }
  .btn { display: block; width: calc(100% - 32px); margin: 16px; padding: 14px; border: none; border-radius: 10px; background: var(--main); color: #fff; font-size: 16px; font-weight: 700; }
  .btn.sub { background: #fff; color: var(--text); border: 1px solid #ccc; width: auto; margin: 0; padding: 8px 12px; font-size: 14px; font-weight: 400; }
  .btn:disabled { opacity: .5; }
  .msg { margin: 40px 16px; text-align: center; line-height: 1.7; }
  .error { color: #b42318; }
  .note { font-size: 12px; color: var(--sub); margin: 0 16px; }
</style>
</head>
<body>
<div id="app"><p class="msg">読み込み中…</p></div>

<script>
// ===== ここを書き換えてください =====
const LIFF_ID = 'ここにLIFF IDを貼る';
const GAS_URL = 'ここにGASのウェブアプリURLを貼る';
// ====================================

const WEEK = ['日', '月', '火', '水', '木', '金', '土'];
let form = null;
let idToken = null;
const app = document.getElementById('app');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function api(payload) {
  const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(Object.assign({ idToken }, payload)) });
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'エラーが発生しました');
  return data;
}

function showMessage(html, isError) {
  app.innerHTML = `<p class="msg ${isError ? 'error' : ''}">${html}</p>`;
}

function datesInPeriod(a, b) {
  const out = [];
  const [y1, m1, d1] = a.split('-').map(Number);
  const [y2, m2, d2] = b.split('-').map(Number);
  const dt = new Date(y1, m1 - 1, d1);
  const end = new Date(y2, m2 - 1, d2);
  while (dt <= end) {
    out.push(`${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`);
    dt.setDate(dt.getDate() + 1);
  }
  return out;
}

function dayOf(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}

function label(ds) {
  const [, m, d] = ds.split('-').map(Number);
  return `${m}/${d}(${WEEK[dayOf(ds)]})`;
}

function timeSelect(cls, value, disabled) {
  const opts = ['<option value="">--:--</option>']
    .concat(form.timeOptions.map(t => `<option value="${t}" ${t === value ? 'selected' : ''}>${t}</option>`));
  return `<select class="${cls}" ${disabled ? 'disabled' : ''}>${opts.join('')}</select>`;
}

function render() {
  const byDate = {};
  form.entries.forEach(e => { byDate[e.date] = e; });
  const phase = form.phase;
  const banner = {
    open: `締切：${esc(form.deadline)}　締切までは何度でも修正できます`,
    late: `締切を過ぎました。${esc(form.lateUntil)}までは、空いている日の追加のみできます`,
    closed: '今回の受付は終了しました。変更は店長に直接連絡してください',
  }[phase];

  const rows = datesInPeriod(form.periodStart, form.periodEnd).map(ds => {
    const e = byDate[ds];
    const dow = dayOf(ds);
    const cls = dow === 0 ? 'sun' : dow === 6 ? 'sat' : '';
    const locked = (phase === 'late' && e) || phase === 'closed';
    let body;
    if (locked) {
      body = e
        ? `<span class="locked">${e.start}〜${e.end}<span class="tag ${e.kind === '追加' ? 'add' : ''}">${e.kind === '追加' ? '追加' : '提出済み'}</span></span>`
        : '<span class="locked">―</span>';
    } else {
      body = `<span class="times">${timeSelect('start', e ? e.start : '')}〜${timeSelect('end', e ? e.end : '')}</span>
              <button class="clear" type="button">クリア</button>`;
    }
    return `<div class="row" data-date="${ds}" data-locked="${locked ? 1 : 0}"><span class="date ${cls}">${label(ds)}</span>${body}</div>`;
  }).join('');

  const bulk = phase === 'closed' ? '' : `
    <div class="card">
      <h2>曜日でまとめて入力</h2>
      <div class="weeks">${WEEK.map((w, i) => `<label><input type="checkbox" value="${i}"> ${w}</label>`).join('')}</div>
      <div class="times">${timeSelect('bulk-start', '')}〜${timeSelect('bulk-end', '')}
        <button class="btn sub" type="button" id="bulk-apply">反映</button></div>
    </div>`;

  app.innerHTML = `
    <header>
      <h1>シフト提出</h1>
      <p>${esc(form.storeName)}　${esc(form.staffName)}さん</p>
      <p>対象期間：${label(form.periodStart)}〜${label(form.periodEnd)}</p>
    </header>
    <div class="banner ${phase}">${banner}</div>
    ${bulk}
    <div class="card"><h2>出勤できる日と時間</h2>${rows}</div>
    <p class="note">出勤できない日は空欄のままにしてください。</p>
    ${phase === 'closed' ? '' : `<button class="btn" id="submit">${phase === 'late' ? '追加を提出する' : '提出する'}</button>`}
  `;

  app.querySelectorAll('.clear').forEach(b => b.addEventListener('click', ev => {
    const row = ev.target.closest('.row');
    row.querySelector('.start').value = '';
    row.querySelector('.end').value = '';
  }));
  const bulkBtn = document.getElementById('bulk-apply');
  if (bulkBtn) bulkBtn.addEventListener('click', applyBulk);
  const submitBtn = document.getElementById('submit');
  if (submitBtn) submitBtn.addEventListener('click', submit);
}

function applyBulk() {
  const days = [...app.querySelectorAll('.weeks input:checked')].map(i => Number(i.value));
  const s = app.querySelector('.bulk-start').value;
  const e = app.querySelector('.bulk-end').value;
  if (!days.length) return alert('曜日を選んでください');
  if (!s || !e) return alert('開始と終了の時刻を選んでください');
  if (s >= e) return alert('終了は開始より後の時刻にしてください');
  app.querySelectorAll('.row[data-locked="0"]').forEach(row => {
    if (days.includes(dayOf(row.dataset.date))) {
      row.querySelector('.start').value = s;
      row.querySelector('.end').value = e;
    }
  });
}

function collect() {
  const entries = [];
  const errors = [];
  app.querySelectorAll('.row[data-locked="0"]').forEach(row => {
    const s = row.querySelector('.start').value;
    const e = row.querySelector('.end').value;
    const ds = row.dataset.date;
    if (!s && !e) return;
    if (!s || !e) errors.push(`${label(ds)}：開始と終了の両方を選んでください`);
    else if (s >= e) errors.push(`${label(ds)}：終了は開始より後の時刻にしてください`);
    else entries.push({ date: ds, start: s, end: e });
  });
  return { entries, errors };
}

async function submit() {
  const { entries, errors } = collect();
  if (errors.length) return alert(errors.join('\n'));
  if (form.phase === 'late' && !entries.length) return alert('追加する日を入力してください');
  if (form.phase === 'open' && !entries.length && !confirm('出勤できる日が1日もありません。このまま提出しますか？')) return;

  const btn = document.getElementById('submit');
  btn.disabled = true;
  btn.textContent = '送信中…';
  try {
    const result = await api({ action: 'submit', entries });
    // 本人の発言として送ると、ボットからの返信（通数にカウントされない）で提出内容が届く
    try {
      if (liff.isInClient()) await liff.sendMessages([{ type: 'text', text: 'シフトを提出しました' }]);
    } catch (e) { /* トーク画面以外から開いた場合は送れないので無視 */ }
    const text = result.phase === 'late' ? `${result.added}日分を追加しました。` : '提出しました。';
    app.innerHTML = `<p class="msg">${text}<br>LINEのトーク画面に提出内容が届きます。</p>
      <button class="btn" id="close">閉じる</button>`;
    document.getElementById('close').addEventListener('click', () => {
      if (liff.isInClient()) liff.closeWindow(); else showMessage('このページを閉じてください。');
    });
  } catch (e) {
    alert(e.message);
    btn.disabled = false;
    btn.textContent = form.phase === 'late' ? '追加を提出する' : '提出する';
  }
}

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    form = await api({ action: 'getForm' });
    render();
  } catch (e) {
    showMessage(esc(e.message), true);
  }
}
main();
</script>
</body>
</html>
